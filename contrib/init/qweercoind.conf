description "Qweercoin Core Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env QWEERCOIND_BIN="/usr/bin/qweercoind"
env QWEERCOIND_USER="qweercoin"
env QWEERCOIND_GROUP="qweercoin"
env QWEERCOIND_PIDDIR="/var/run/qweercoind"
# upstart can't handle variables constructed with other variables
env QWEERCOIND_PIDFILE="/var/run/qweercoind/qweercoind.pid"
env QWEERCOIND_CONFIGFILE="/etc/qweercoin/qweercoin.conf"
env QWEERCOIND_DATADIR="/var/lib/qweercoind"

expect fork

respawn
respawn limit 5 120
kill timeout 600

pre-start script
    # this will catch non-existent config files
    # qweercoind will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$QWEERCOIND_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run qweercoind."
        echo "The setting must appear in $QWEERCOIND_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following "
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"Qweercoin Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$QWEERCOIND_PIDDIR"
    chmod 0755 "$QWEERCOIND_PIDDIR"
    chown $QWEERCOIND_USER:$QWEERCOIND_GROUP "$QWEERCOIND_PIDDIR"
    chown $QWEERCOIND_USER:$QWEERCOIND_GROUP "$QWEERCOIND_CONFIGFILE"
    chmod 0660 "$QWEERCOIND_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$QWEERCOIND_PIDFILE" \
    --chuid $QWEERCOIND_USER:$QWEERCOIND_GROUP \
    --exec "$QWEERCOIND_BIN" \
    -- \
    -pid="$QWEERCOIND_PIDFILE" \
    -conf="$QWEERCOIND_CONFIGFILE" \
    -datadir="$QWEERCOIND_DATADIR" \
    -disablewallet \
    -daemon

